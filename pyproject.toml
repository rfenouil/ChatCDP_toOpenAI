[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat2openai"
version = "0.1.0"
description = "Proxy local exposant un endpoint OpenAI-compatible adosse a un chat web pilote via CDP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "requests>=2.31",
  "pydantic>=2",
  "pydantic-settings>=2",
  "click>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
chat2openai = "chat2openai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chat2openai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
